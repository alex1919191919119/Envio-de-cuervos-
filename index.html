<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consejo Negro RPG - La Casa del Dragón</title>
    <style>
        body { 
            background: radial-gradient(circle at top center, #3a0808 0%, #050505 100%);
            background-attachment: fixed;
            color: #d4af37; 
            font-family: 'Georgia', serif; 
            margin: 0; 
            display: flex; 
            height: 100vh; 
        }
        
        .main-container { display: flex; width: 100%; }
        
        .main-content { 
            width: 70%; 
            padding: 30px; 
            overflow-y: auto; 
            background-color: rgba(10, 10, 10, 0.6); 
        }
        
        .header-title { 
            text-align: center; 
            color: #b22222; 
            font-size: 2.8em; 
            letter-spacing: 2px; 
            text-shadow: 2px 2px 5px #000;
        }
        
        .visual-display { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        
        .visual-display img { 
            width: 100%; 
            height: 250px; 
            object-fit: cover; 
            border: 2px solid #8b0000; 
            border-radius: 8px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }
        
        .raven-system, .message-system { 
            background: linear-gradient(145deg, #1f0505, #111);
            border: 1px solid #8b0000; 
            padding: 20px; 
            border-radius: 8px; 
            text-align: center; 
            margin-bottom: 25px;
            box-shadow: inset 0 0 15px #000, 0 5px 15px rgba(139,0,0,0.2);
        }
        
        .raven-system select, .raven-system button, .message-system textarea, .message-system select, .message-system button { 
            padding: 10px; 
            font-size: 15px; 
            margin: 8px; 
            background-color: #050505; 
            color: #d4af37; 
            border: 1px solid #d4af37; 
            cursor: pointer; 
            font-family: 'Georgia', serif; 
            border-radius: 4px; 
            width: 90%;
        }
        
        .raven-system button, .message-system button { width: auto; font-weight: bold; }
        .raven-system button:hover, .message-system button:hover { background-color: #8b0000; color: white; border-color: #8b0000; box-shadow: 0 0 10px #8b0000; }
        
        .sidebar { 
            width: 30%; 
            background-color: rgba(15, 15, 15, 0.85); 
            border-left: 2px solid #8b0000; 
            padding: 20px; 
            overflow-y: auto; 
            box-shadow: -5px 0 20px rgba(0,0,0,0.7);
        }
        
        .sidebar h3 { text-align: center; border-bottom: 1px solid #444; padding-bottom: 10px; font-size: 1.2em; text-shadow: 1px 1px 3px #000; }
        
        .player-list { list-style: none; padding: 0; }
        
        .player-list li { 
            display: flex; 
            align-items: center; 
            background: linear-gradient(90deg, #1f0505, #1a1a1a);
            padding: 10px; 
            margin-bottom: 10px; 
            border-radius: 5px; 
            border: 1px solid #333;
        }
        
        .avatar { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #d4af37; margin-right: 15px; object-fit: cover; box-shadow: 0 0 8px #d4af37; }
        
        .online-dot { width: 10px; height: 10px; background-color: #00ff00; border-radius: 50%; margin-left: auto; box-shadow: 0 0 8px #00ff00; }
        
        .auth-panel { 
            background: linear-gradient(145deg, #2a0808, #111);
            padding: 15px; 
            border-radius: 8px; 
            margin-top: 20px; 
            text-align: center; 
            border: 1px solid #8b0000; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        
        .auth-panel input { width: 90%; margin-bottom: 10px; padding: 8px; border-radius: 4px; border: 1px solid #555; background-color: #0a0a0a; color: #d4af37; }
        
        .auth-btn { width: 45%; padding: 8px; margin: 5px 2%; border: none; cursor: pointer; border-radius: 4px; font-family: 'Georgia', serif; font-weight: bold; transition: 0.3s; }
        .btn-login { background-color: #333; color: white; border: 1px solid #555; }
        .btn-register { background-color: #8b0000; color: white; border: 1px solid #ff4c4c; }

        .feed-global {
            background-color: rgba(20, 5, 5, 0.9);
            border: 1px dashed #d4af37;
            padding: 15px;
            border-radius: 6px;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="main-content">
        <h1 class="header-title">El consejo negro</h1>
        
        <div class="visual-display">
            <img src="banderas.jpeg" alt="Banderas Facciones">
            <img src="estandartes.jpeg" alt="Estandartes de las Casas">
            <img src="tapiz.jpeg" alt="Tapiz de Poniente" style="grid-column: span 2; height: 150px;"> 
        </div>

        <!-- Sistema de Cuervos Globales -->
        <div class="raven-system">
            <h2>Enviar cuervo mensajero al reino</h2>
            <select id="rutaCuervo" style="width: 60%;">
                <option value="0.1">Ruta segura (10% riesgo)</option>
                <option value="0.5">Ruta rápida (50% riesgo)</option>
                <option value="0.8">Sobrevolar territorio enemigo (80% riesgo)</option>
            </select>
            <button id="btnCuervo">Liberar cuervo global</button>
        </div>

        <!-- Sistema de Mensajes Privados / Pergaminos -->
        <div class="message-system" id="panelMensajes" style="display:none;">
            <h2>Enviar pergamino secreto</h2>
            <select id="destinatarioSelect">
                <option value="todos">A todo el Consejo (Público)</option>
            </select>
            <textarea id="textoMensaje" rows="3" placeholder="Escribe tu mensaje o decreto..."></textarea>
            <button id="btnEnviarMensaje">Enviar pergamino</button>
        </div>

        <!-- Registro de Eventos en Vivo -->
        <div class="raven-system">
            <h3>Crónicas y Cuervos en el Cielo</h3>
            <div class="feed-global" id="feedEventos">
                <p style="color: #77; text-align: center;">Esperando eventos en los Siete Reinos...</p>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <!-- Panel de Autenticación y Perfil -->
        <div class="auth-panel" id="panelAuth">
            <h3 style="color: #d4af37; border: none; margin-top: 0;">Acceso a la sala</h3>
            <input type="text" id="usuarioInput" placeholder="Nombre de tu personaje">
            <input type="password" id="passInput" placeholder="Contraseña">
            <input type="text" id="avatarInput" placeholder="URL de tu foto de perfil (Opcional)">
            <p style="font-size: 0.75em; color: #aaa; margin-top: 0; margin-bottom: 12px; text-align: left;">
                * Contraseña exclusiva. Si pones enlace de foto, que sea directo a imagen.
            </p>
            <div>
                <button class="auth-btn btn-login" id="btnLogin">Entrar</button>
                <button class="auth-btn btn-register" id="btnRegister">Crear cuenta</button>
            </div>
        </div>

        <h3>Usuarios conectados</h3>
        <ul class="player-list" id="listaUsuariosActivos">
        </ul>
    </div>
</div>

<!-- Lógica de Firebase (Auth + Firestore en tiempo real) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, setDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAK2zidlUykm3J86-e_AM5JCswvFznyE-A",
        authDomain: "consejo-4d810.firebaseapp.com",
        projectId: "consejo-4d810",
        storageBucket: "consejo-4d810.firebasestorage.app",
        messagingSenderId: "1062967101002",
        appId: "1:1062967101002:web:03940dc1f4ff3abf0c88b3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let usuarioActual = null;

    // 1. Botón de Lanzar Cuervo Global
    document.getElementById("btnCuervo").addEventListener("click", async () => {
        if (!usuarioActual) return;
        let selector = document.getElementById("rutaCuervo");
        let riesgo = parseFloat(selector.value);
        let nombreJugador = usuarioActual.email.split('@')[0];

        let interceptado = Math.random() < riesgo;
        let textoAccion = interceptado ? 
            `🩸 ¡Cuervo interceptado! El mensaje de ${nombreJugador} fue derribado en pleno vuelo.` : 
            `📜 ¡Cuervo en ruta! ${nombreJugador} ha lanzado un mensaje a través del reino.`;

        // Guardamos el evento en Firestore para que le aparezca a TODOS en tiempo real
        try {
            await addDoc(collection(db, "eventos"), {
                texto: textoAccion,
                tipo: interceptado ? "peligro" : "exito",
                timestamp: serverTimestamp()
            });
        } catch (e) {
            console.error("Error al enviar evento: ", e);
        }
    });

    // 2. Botón de Enviar Mensaje / Pergamino
    document.getElementById("btnEnviarMensaje").addEventListener("click", async () => {
        if (!usuarioActual) return;
        let texto = document.getElementById("textoMensaje").value.trim();
        let destinatario = document.getElementById("destinatarioSelect").value;
        let remitente = usuarioActual.email.split('@')[0];

        if (texto === "") {
            alert("El pergamino no puede ir en blanco.");
            return;
        }

        try {
            await addDoc(collection(db, "eventos"), {
                texto: `✉️ [De ${remitente} para ${destinatario}]: "${texto}"`,
                tipo: "mensaje",
                timestamp: serverTimestamp()
            });
            document.getElementById("textoMensaje").value = "";
        } catch (e) {
            console.error("Error al enviar pergamino: ", e);
        }
    });

    // 3. Sistema de Autenticación y Registro con Foto Personalizada
    function procesarAcceso(accion) {
        let nombre = document.getElementById("usuarioInput").value.trim();
        let password = document.getElementById("passInput").value;
        let avatarCustom = document.getElementById("avatarInput").value.trim();

        if (nombre === "" || password === "") {
            alert("Por favor, ingresa nombre y contraseña.");
            return;
        }

        let correoSecreto = nombre.replace(/\s+/g, '') + "@rol.com";
        // Si no puso foto, usamos una por defecto o el broche
        let fotoFinal = avatarCustom !== "" ? avatarCustom : "broche.jpeg";

        if (accion === 'registrar') {
            createUserWithEmailAndPassword(auth, correoSecreto, password)
                .then((userCredential) => {
                    return updateProfile(userCredential.user, {
                        displayName: nombre,
                        photoURL: fotoFinal
                    });
                })
                .then(() => {
                    alert("¡Cuenta creada con éxito, " + nombre + "!");
                    return signInWithEmailAndPassword(auth, correoSecreto, password);
                })
                .catch((error) => {
                    alert("Mensaje de Firebase: " + error.message);
                });
        } else {
            signInWithEmailAndPassword(auth, correoSecreto, password)
                .then((userCredential) => {
                    // Actualizamos foto si cambió en el input al iniciar sesión
                    if(avatarCustom !== "") {
                        return updateProfile(userCredential.user, { photoURL: avatarCustom });
                    }
                })
                .catch((error) => alert("Error al entrar: " + error.message));
        }
    }

    document.getElementById("btnLogin").addEventListener("click", () => procesarAcceso('entrar'));
    document.getElementById("btnRegister").addEventListener("click", () => procesarAcceso('registrar'));

    // 4. Sincronización en Tiempo Real de Usuarios Activos y Destinatarios
    onAuthStateChanged(auth, async (user) => {
        usuarioActual = user;
        const panelAuth = document.getElementById("panelAuth");
        const panelMensajes = document.getElementById("panelMensajes");

        if (user) {
            panelAuth.style.display = "none";
            panelMensajes.style.display = "block";
            let nombreLimpio = user.email.split('@')[0];
            let fotoUser = user.photoURL || "broche.jpeg";

            // Registramos presencia en Firestore
            await setDoc(doc(db, "usuariosActivos", user.uid), {
                nombre: nombreLimpio,
                avatar: fotoUser,
                lastSeen: serverTimestamp()
            });

        } else {
            panelAuth.style.display = "block";
            panelMensajes.style.display = "none";
            document.getElementById("listaUsuariosActivos").innerHTML = '';
            // Si el usuario cierra sesión o sale, podemos limpiar su presencia
        }
    });

    // Escuchar cambios en la lista de usuarios conectados en tiempo real
    onSnapshot(collection(db, "usuariosActivos"), (snapshot) => {
        let contenedorLista = document.getElementById("listaUsuariosActivos");
        let selectDestinatario = document.getElementById("destinatarioSelect");
        
        contenedorLista.innerHTML = '';
        selectDestinatario.innerHTML = '<option value="todos">A todo el Consejo (Público)</option>';

        snapshot.forEach((docSnap) => {
            let data = docSnap.data();
            
            // Render en la lista lateral
            let nuevoUsuario = document.createElement("li");
            let avatarSrc = data.avatar ? data.avatar : "broche.jpeg";
            nuevoUsuario.innerHTML = `
                <img src="${avatarSrc}" class="avatar" onerror="this.src='broche.jpeg'">
                <span>${data.nombre}</span>
                <div class="online-dot"></div>
            `;
            contenedorLista.appendChild(nuevoUsuario);

            // Agregar al selector de mensajes privados
            if (usuarioActual && data.nombre !== usuarioActual.email.split('@')[0]) {
                let option = document.createElement("option");
                option.value = data.nombre;
                option.innerText = data.nombre;
                selectDestinatario.appendChild(option);
            }
        });
    });

    // 5. Escuchar Eventos y Cuervos Globales en Tiempo Real en Pantalla
    const q = query(collection(db, "eventos"), orderBy("timestamp", "desc"));
    onSnapshot(q, (snapshot) => {
        let feed = document.getElementById("feedEventos");
        feed.innerHTML = '';
        
        if (snapshot.empty) {
            feed.innerHTML = '<p style="color: #777; text-align: center;">Aún no hay cuervos en el cielo...</p>';
            return;
        }

        snapshot.forEach((docSnap) => {
            let evento = docSnap.data();
            let p = document.createElement("p");
            p.style.margin = "6px 0";
            
            if (evento.tipo === "peligro") {
                p.style.color = "#ff6b6b";
            } else if (evento.tipo === "exito") {
                p.style.color = "#51cf66";
            } else {
                p.style.color = "#ffd43b"; // Mensajes / pergaminos
            }

            p.innerText = evento.texto;
            feed.appendChild(p);
        });
    });
</script>
</body>
</html>
